// Slow echo service — demonstrates client deadline / DEADLINE_EXCEEDED in rpcpio.

syntax = "proto3";

package slowecho;

option cc_enable_arenas = true;

service SlowEchoService {
    // Waits two seconds before echoing the request back.
    rpc SlowEcho(EchoRequest) returns (EchoResponse);
}

message EchoRequest  { string message = 1; }
message EchoResponse { string message = 1; }
