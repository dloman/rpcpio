// Hello World service — example for asio_grpc.
// No gRPC Core headers or libraries are used.

syntax = "proto3";

package helloworld;

option cc_enable_arenas = true;

service Greeter {
    // Sends a greeting.
    rpc SayHello(HelloRequest) returns (HelloReply);
}

message HelloRequest {
    string name = 1;
}

message HelloReply {
    string message = 1;
}
