// Subset of the official gRPC interoperability test proto.

syntax = "proto3";

package grpc.testing;

option cc_enable_arenas = true;

// Test service covering unary and all three streaming RPC variants.
service TestService {
    // One empty request followed by one empty response.
    rpc EmptyCall(Empty) returns (Empty);

    // One request followed by one response.
    rpc UnaryCall(SimpleRequest) returns (SimpleResponse);

    // Server streaming: the server sends response_size individual responses.
    // Each response carries a payload of (i+1) bytes where i is its 0-based index.
    rpc StreamingOutputCall(SimpleRequest) returns (stream SimpleResponse);

    // Client streaming: the client sends a sequence of requests; the server
    // returns a single response whose payload.body length equals the sum of
    // all request response_size fields.
    rpc StreamingInputCall(stream SimpleRequest) returns (SimpleResponse);

    // Bidi streaming: for each request the server echoes back one response
    // carrying the same payload.body as the request.
    rpc FullDuplexCall(stream SimpleRequest) returns (stream SimpleResponse);
}

// An empty message that you can re-use to avoid defining duplicated empty
// messages in your APIs.
message Empty {}

enum PayloadType {
    COMPRESSABLE = 0;
}

message Payload {
    PayloadType type = 1;
    bytes body = 2;
}

message EchoStatus {
    int32 code = 1;
    string message = 2;
}

message SimpleRequest {
    PayloadType response_type = 1;
    int32 response_size = 2;
    Payload payload = 3;
    bool fill_username = 4;
    bool fill_oauth_scope = 5;
    bool response_compressed = 6;
    EchoStatus response_status = 7;
    bool fill_server_id = 9;
    bool fill_grpclb_route_type = 10;
}

message SimpleResponse {
    Payload payload = 1;
    string username = 2;
    string oauth_scope = 3;
}
